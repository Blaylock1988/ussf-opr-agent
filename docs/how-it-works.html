<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the OPR Writer Works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f2f5f8;   /* tint of USSF Silver */
      --color-ink:    #101820;   /* USSF Black */
      --color-muted:  #00263a;   /* USSF Midnight Blue */
      --color-accent: #00308f;   /* DAF Blue */
    }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1240 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="opr-writer-flow-title opr-writer-flow-desc">
      <title id="opr-writer-flow-title">How the OPR writer works</title>
      <desc id="opr-writer-flow-desc">The opr-writer skill turns a folder of accomplishment notes and prior OPRs into a DAF Form 707 draft in four steps (interview, research, draft, and a fit-and-check loop that repeats until clean), backed by bundled reference data; solid-marked claims are measured and dashed-marked claims are design intent.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00263a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00308f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f5f8"/>

      <!-- Title -->
      <text x="20" y="52" fill="#101820" font-size="32" font-family="'Instrument Serif', serif">How the OPR writer works</text>
      <text x="20" y="80" fill="#56636e" font-size="13" font-family="'Geist', sans-serif">From a folder of notes to a board-ready DAF Form 707</text>

      <!-- Arrows (drawn before boxes) -->
      <path d="M180 232 H226" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M388 232 H434" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M596 232 H642" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M804 232 H850" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M1012 232 H1058" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M724 128 V174" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <path d="M932 128 V174" stroke="#00263a" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

      <!-- Store: bundled reference data -->
      <rect x="644" y="24" width="368" height="104" rx="6" fill="#f2f5f8"/>
      <rect x="644" y="24" width="368" height="104" rx="6" fill="#dbe2e9" stroke="#00263a" stroke-width="1"/>
      <rect x="656" y="32" width="40" height="16" rx="2" fill="none" stroke="rgba(0,38,58,0.45)" stroke-width="0.8"/>
      <text x="676" y="43" fill="#00263a" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DATA</text>
      <text x="708" y="45" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Bundled reference data</text>
      <g font-family="'Geist', sans-serif" font-size="12">
        <rect x="656" y="64" width="3" height="35" fill="#101820"/>
        <text x="668" y="78" fill="#101820" font-weight="500">17 data files, incl. 211 approved abbreviations,</text>
        <text x="668" y="94" fill="#101820" font-weight="500">148 AFPC acronyms and 726 action verbs</text>
      </g>

      <!-- Node: input -->
      <rect x="20" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="20" y="176" width="160" height="112" rx="6" fill="#f2f5f8" stroke="#56636e" stroke-width="1"/>
      <rect x="30" y="186" width="44" height="16" rx="2" fill="none" stroke="rgba(86,99,110,0.5)" stroke-width="0.8"/>
      <text x="52" y="197" fill="#56636e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">INPUT</text>
      <text x="100" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your folder</text>
      <text x="100" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">accomplishments,</text>
      <text x="100" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">awards, prior OPRs</text>

      <!-- Node: step 1 -->
      <rect x="228" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="228" y="176" width="160" height="112" rx="6" fill="#ffffff" stroke="#101820" stroke-width="1"/>
      <rect x="238" y="186" width="48" height="16" rx="2" fill="none" stroke="rgba(16,24,32,0.4)" stroke-width="0.8"/>
      <text x="262" y="197" fill="#101820" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STEP 1</text>
      <text x="308" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Interview</text>
      <text x="308" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">board, rating chain,</text>
      <text x="308" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">fitness, fact ledger</text>

      <!-- Node: step 2 -->
      <rect x="436" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="436" y="176" width="160" height="112" rx="6" fill="#ffffff" stroke="#101820" stroke-width="1"/>
      <rect x="446" y="186" width="48" height="16" rx="2" fill="none" stroke="rgba(16,24,32,0.4)" stroke-width="0.8"/>
      <text x="470" y="197" fill="#101820" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STEP 2</text>
      <text x="516" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Research</text>
      <text x="516" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">impact sources,</text>
      <text x="516" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">past-record review</text>

      <!-- Node: step 3 -->
      <rect x="644" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="644" y="176" width="160" height="112" rx="6" fill="#ffffff" stroke="#101820" stroke-width="1"/>
      <rect x="654" y="186" width="48" height="16" rx="2" fill="none" stroke="rgba(16,24,32,0.4)" stroke-width="0.8"/>
      <text x="678" y="197" fill="#101820" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STEP 3</text>
      <text x="724" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft</text>
      <text x="724" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">every block, plus</text>
      <text x="724" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">alternates and spares</text>

      <!-- Node: step 4 (focal) -->
      <rect x="852" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="852" y="176" width="160" height="112" rx="6" fill="rgba(0,48,143,0.08)" stroke="#00308f" stroke-width="1.5"/>
      <rect x="862" y="186" width="48" height="16" rx="2" fill="none" stroke="rgba(0,48,143,0.5)" stroke-width="0.8"/>
      <text x="886" y="197" fill="#00308f" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">STEP 4</text>
      <path d="M996 194 A8 8 0 1 1 988 186" stroke="#00308f" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="932" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fit + check loop</text>
      <text x="932" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">fit width, check rules,</text>
      <text x="932" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">fix; repeat until clean</text>

      <!-- Node: output -->
      <rect x="1060" y="176" width="160" height="112" rx="6" fill="#f2f5f8"/>
      <rect x="1060" y="176" width="160" height="112" rx="6" fill="#f2f5f8" stroke="#56636e" stroke-width="1"/>
      <rect x="1070" y="186" width="52" height="16" rx="2" fill="none" stroke="rgba(86,99,110,0.5)" stroke-width="0.8"/>
      <text x="1096" y="197" fill="#56636e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OUTPUT</text>
      <text x="1140" y="230" fill="#101820" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Word document</text>
      <text x="1140" y="254" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">page 1: the OPR, laid</text>
      <text x="1140" y="272" fill="#56636e" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">out like the 707</text>

      <!-- Claims row -->
      <g font-family="'Geist', sans-serif" font-size="12">
        <line x1="21.5" y1="322" x2="21.5" y2="373" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="32" y="336" fill="#56636e">Every claim traces to</text>
        <text x="32" y="352" fill="#56636e">your inputs or a source</text>
        <text x="32" y="368" fill="#56636e">you confirmed</text>

        <line x1="229.5" y1="322" x2="229.5" y2="357" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="240" y="336" fill="#56636e">You confirm each fact</text>
        <text x="240" y="352" fill="#56636e">before any drafting</text>

        <line x1="437.5" y1="322" x2="437.5" y2="357" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="448" y="336" fill="#56636e">Generic public searches;</text>
        <text x="448" y="352" fill="#56636e">you approve each source</text>

        <line x1="645.5" y1="322" x2="645.5" y2="373" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="656" y="336" fill="#56636e">One accomplishment per</text>
        <text x="656" y="352" fill="#56636e">line; no opening verb</text>
        <text x="656" y="368" fill="#56636e">used twice</text>

        <rect x="852" y="322" width="3" height="35" fill="#101820"/>
        <text x="864" y="336" fill="#101820" font-weight="500">26 rule families checked,</text>
        <text x="864" y="352" fill="#101820" font-weight="500">from verbs to strats</text>
        <rect x="852" y="370" width="3" height="51" fill="#101820"/>
        <text x="864" y="384" fill="#101820" font-weight="500">Fit window: 0.30 mm</text>
        <text x="864" y="400" fill="#101820" font-weight="500">under the 707's</text>
        <text x="864" y="416" fill="#101820" font-weight="500">201.05 mm line width</text>

        <line x1="1061.5" y1="322" x2="1061.5" y2="357" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="1072" y="336" fill="#56636e">Won't export while</text>
        <text x="1072" y="352" fill="#56636e">a rule error remains</text>
      </g>

      <!-- Key strip -->
      <line x1="20" y1="448" x2="1220" y2="448" stroke="rgba(16,24,32,0.12)" stroke-width="0.8"/>
      <g font-family="'Geist', sans-serif" font-size="11">
        <rect x="20" y="464" width="3" height="15" fill="#101820"/>
        <text x="32" y="475" fill="#101820" font-weight="500">Measured: counted from the repo on 2026-09-28 (commit f1a01c7)</text>
        <line x1="449.5" y1="464" x2="449.5" y2="479" stroke="#56636e" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="460" y="475" fill="#56636e">Design intent: what the skill is built to do</text>
      </g>
    </svg>
  </div>
</body>
</html>
